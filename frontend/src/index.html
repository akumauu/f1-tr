<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>F1 TR 赛后复盘</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brandMark" aria-hidden="true"></span>
        <div class="brandText">
          <h1>F1 <span>赛后复盘</span></h1>
          <p id="sessionMeta">正在加载数据…</p>
        </div>
      </div>
      <div class="topbarRight">
        <div class="status" id="loadStatus">启动中</div>
      </div>
    </header>

    <main class="workspace">
      <section class="hero" id="heroStats" aria-label="比赛关键数据"></section>

      <section class="controls" aria-label="赛段筛选">
        <label>
          <span>年份</span>
          <select id="yearSelect"></select>
        </label>
        <label>
          <span>分站</span>
          <select id="meetingSelect"></select>
        </label>
        <label>
          <span>赛段</span>
          <select id="sessionSelect"></select>
        </label>
        <label class="searchBox">
          <span>TR 搜索</span>
          <input id="searchInput" type="search" placeholder="转录 · 意图 · 车手">
        </label>
        <label>
          <span>起始圈</span>
          <input id="lapMin" type="number" min="1" step="1">
        </label>
        <label>
          <span>结束圈</span>
          <input id="lapMax" type="number" min="1" step="1">
        </label>
        <button id="resetFilters" type="button" class="ghostBtn">重置</button>
      </section>

      <section class="panel insightsPanel" aria-label="赛事洞察">
        <div class="panelHeader">
          <h2>赛事洞察</h2>
          <span id="insightScope" class="muted"></span>
        </div>
        <div class="insightGrid" id="insightGrid"></div>
      </section>

      <section class="panel selectorPanel" aria-label="车手筛选">
        <div class="panelHeader">
          <h2>车手</h2>
          <div class="selectorActions">
            <span id="driverCount" class="muted"></span>
            <div class="quickBtns">
              <button type="button" data-pick="all">全部</button>
              <button type="button" data-pick="none">清空</button>
              <button type="button" data-pick="podium">前三</button>
              <button type="button" data-pick="points">积分区</button>
            </div>
          </div>
        </div>
        <div class="driverGrid" id="driverGrid"></div>
      </section>

      <section class="panel analysisPanel" aria-label="分析图表">
        <div class="panelHeader analysisHeader">
          <div class="tabs" id="chartTabs" role="tablist">
            <button type="button" class="tab" data-chart="positions" role="tab">比赛位置</button>
            <button type="button" class="tab" data-chart="pace" role="tab">圈速节奏</button>
            <button type="button" class="tab" data-chart="strategy" role="tab">轮胎策略</button>
            <button type="button" class="tab" data-chart="degradation" role="tab">轮胎衰退</button>
          </div>
          <span id="chartCaption" class="muted"></span>
        </div>
        <p class="chartHint" id="chartHint"></p>
        <div class="chartStage" id="chartStage">
          <canvas id="chart"></canvas>
          <div class="chartTip" id="chartTip" hidden></div>
        </div>
        <div class="legend" id="chartLegend"></div>
      </section>

      <section class="panel">
        <div class="panelHeader">
          <h2>圈速明细</h2>
          <span id="lapCount" class="muted"></span>
        </div>
        <div class="tableWrap">
          <table class="dataTable">
            <thead>
              <tr>
                <th class="number">圈数</th>
                <th>车手</th>
                <th>轮胎</th>
                <th class="number">单圈</th>
                <th class="number">S1</th>
                <th class="number">S2</th>
                <th class="number">S3</th>
                <th class="number">较上一圈</th>
                <th>进站</th>
              </tr>
            </thead>
            <tbody id="lapRows"></tbody>
          </table>
        </div>
      </section>

      <section class="split">
        <div class="panel">
          <div class="panelHeader">
            <h2>轮胎段与衰退</h2>
            <span id="stintCount" class="muted"></span>
          </div>
          <div class="tableWrap">
            <table class="dataTable">
              <thead>
                <tr>
                  <th>车手</th>
                  <th class="number">段数</th>
                  <th>配方</th>
                  <th>圈段</th>
                  <th class="number">每圈衰退</th>
                  <th class="number">最佳</th>
                </tr>
              </thead>
              <tbody id="stintRows"></tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <div class="panelHeader">
            <h2>车队无线电</h2>
            <span id="radioCount" class="muted"></span>
          </div>
          <div class="tableWrap" id="radioList"></div>
        </div>
      </section>

      <section class="split" id="extraPanels"></section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
